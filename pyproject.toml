[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow"
version = "1.0.0"
description = "ARROW: deciding whether one executable reading of a written safety rule is sufficient for constrained reinforcement learning"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
learners = ["torch>=2.0", "scikit-learn>=1.3", "pandas>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
