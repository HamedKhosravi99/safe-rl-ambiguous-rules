# Conda environment for the released offline safe-RL learners (DSRL/OSRL) on a V100 GPU node.
# Create once on the cluster:  conda env create -f experiments/dsrl_learners/env.yml
# (CPU-only deps here; add the GPU build of torch matching the cluster CUDA version)
name: saorl
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - pyyaml
  - tqdm
  - pip
  - pip:
      - statsmodels      # Fleiss' kappa, agreement stats for the annotator study
