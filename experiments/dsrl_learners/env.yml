# Conda environment for SA-ORL on PACE Phoenix.
# Create once on the cluster:  conda env create -f pace/env.yml
# (CPU-only deps here; add the GPU build of torch on the cluster, see setup_env.sh)
name: saorl
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - pyyaml
  - tqdm
  - pip
  - pip:
      - statsmodels      # Fleiss' kappa, agreement stats for the annotator study
